name: Update Latest Release

on:
  push:
    paths:
      - 'Karing_mobile.zip'
      - 'Karing_desktop.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date and time (MSK)
        id: datetime
        run: echo "datetime=$(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Delete old release tag
        run: gh release delete latest --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Update backup files #${{ github.run_number }} (${{ steps.datetime.outputs.datetime }} MSK)"
          body: |
            ### 📦 Актуальные бэкапы конфигураций Karing

            **Время сборки:** `${{ steps.datetime.outputs.datetime }} MSK`

            #### 🔗 Ссылки для прямого импорта:
            * **Mobile:** `https://github.com/Sn1pp1/karing_backup/releases/download/latest/Karing_mobile.zip`
            * **Desktop:** `https://github.com/Sn1pp1/karing_backup/releases/download/latest/Karing_desktop.zip`

            ---
            *Архивы обновляются автоматически при отправке новых `.zip` файлов в репозиторий.*
          files: |
            Karing_mobile.zip
            Karing_desktop.zip
